apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: oficina
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oficina
  SPRING_DATASOURCE_USERNAME: postgres
  JPA_DDL_AUTO: validate
  JPA_SHOW_SQL: "false"
  SWAGGER_ENABLED: "true"
  NOTIFICACOES_ENABLED: "true"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: oficina@example.com
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=25
