services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tech-challenge-oficina:local
    container_name: oficina-app
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oficina}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@oficina.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:?Defina INTEGRATION_TOKEN no arquivo .env}
      NOTIFICACOES_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025

    ports:
      - "${APP_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - oficina-network

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - oficina-network

  postgres:
    image: postgres:16.10
    container_name: oficina-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - oficina-fase2-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - oficina-network

volumes:
  oficina-fase2-postgres-data:

networks:
  oficina-network:
    driver: bridge
